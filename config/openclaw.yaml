# vireo config for the OpenClaw-backed endpoint.
#
# dev-backend: openclaw
#
#   terminal 1:  cd ../openclaw-bridge && OPENCLAW_GATEWAY_TOKEN=... go run .
#   terminal 2:  cd ../vireo && go run . --config openclaw
#
# The bridge answers POST /vireo/message on :18090 and translates each message
# into a gateway chat completion. vireo mints the sessions; the bridge maps them
# onto the gateway's session keys.

server:
  port: 7779
  cert_file: "certs/cert.pem"
  key_file: "certs/key.pem"
  alpn:
    - "portico/1"
  call_timeout: "200s"                    # above the bridge's 180s gateway timeout
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10
  endpoint:
    id: "openclaw-dev"
    name: "openclaw"
    description: "A local OpenClaw agent, reachable over the portico protocol."

# Default webhook every agent inherits — the bridge.
transport: "http://127.0.0.1:18090/vireo/message"

session:
  list: true
  ttl_default: 3600
  store: "file"
  file: "vireo-sessions.json"             # name inside sessions/
  retention: "720h"

agents:
  - name: "concierge"
    description: "Ask the local OpenClaw agent anything; it keeps a conversation."
    start_message: "Hi — I'm the OpenClaw agent. What can I help with?"
    timeout: "190s"                       # model turns are not instant
