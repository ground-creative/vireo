# vireo configuration — the demo endpoint.
#
# dev-backend: fakeagent
#
# One endpoint, three agents, one backend (./cmd/fakeagent on :8088).
#
# Only files inside config/ are loaded, and --config is required:
#
#     go run . --config demo
#
# Copy this file for your own endpoint (config/mine.yaml); everything in
# config/ except demo.yaml is ignored by git.

server:
  port: 7777
  cert_file: "certs/cert.pem"
  key_file: "certs/key.pem"
  alpn:
    - "portico/1"
  call_timeout: "45s"
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10
  endpoint:
    id: "restaurant-dev"
    name: "restaurant"
    description: "Fresh pizza and table bookings for the neighborhood"

# Default webhook every agent inherits. The backend dispatches on the
# X-Portico-Agent header. Override per agent only when it lives elsewhere.
transport: "http://127.0.0.1:8088/vireo/message"

# Static references published in the manifest. `links` is the current shape: an
# array, so each entry can say what it is. `refs` (a map of key to URL) still
# works and is still emitted, but cannot carry a label or a media type.
links:
  - rel: "menu"
    href: "http://127.0.0.1:8088/menu"
    label: "Menu"
    type: "text/html"
  - rel: "docs"
    href: "http://127.0.0.1:8088/wiki"
    label: "Wiki"
    type: "text/html"

# Kept deliberately: it proves the compatibility path, and an older client
# still reads what it always read.
refs:
  menu: "http://127.0.0.1:8088/menu"
  docs: "http://127.0.0.1:8088/wiki"

session:
  list: true                            # advertise the session.* commands
  ttl_default: 3600                     # seconds; slides on every message
  length: 32                            # mint rules — server-internal
  store: "file"                         # file | memory — file survives a restart
  file: "vireo-sessions.json"           # name inside sessions/ — rename freely
  retention: "720h"                     # 30d: finished sessions older than this are swept

agents:
  - name: "orders"
    description: "Take food orders: pizzas, sides, drinks, pickup or delivery"
    sessions: true                      # holds multi-turn conversations
    tags: ["orders", "delivery", "pickup"]
    links:
      - rel: "menu"
        href: "http://127.0.0.1:8088/menu"
        label: "Menu"
        type: "text/html"

  - name: "reservations"
    description: "Check availability, book a table and cancel a booking"
    sessions: true

  - name: "concierge"
    description: "Answer anything else: hours, directions, general questions"
    start_message: "Hello! Ask me anything about the restaurant."
    sessions: true
    timeout: "15s"                      # this agent's own webhook timeout
